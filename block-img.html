<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0d14">
<title>图片不可用</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:0;min-height:100vh;background:#0b0d14;color:#e7eaf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{max-width:420px;padding:44px 36px;border:1px solid rgba(255,255,255,.1);border-radius:20px;
    background:linear-gradient(135deg,rgba(139,92,246,.14),rgba(34,211,238,.1)),#171b26;
    box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .icon{width:64px;height:64px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
    background:rgba(248,113,113,.15);border:1px solid rgba(248,113,113,.3)}
  .icon svg{width:30px;height:30px;stroke:#f87171}
  h1{margin:0 0 10px;font-size:1.3em;font-weight:700}
  p{margin:0;color:#9aa4b8;font-size:.95em;line-height:1.7}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    </div>
    <h1>图片不可用</h1>
    <p>该图片未能通过内容审核，可能包含不良信息，暂时无法加载。</p>
  </div>
</body>
</html>
