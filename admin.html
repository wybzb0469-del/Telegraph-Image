<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d14">
  <!-- import CSS -->
  <link rel="stylesheet" href="./assets/vendor/element-ui/index.css">
  <style>
    :root{
      --bg-0:#0b0d14;--bg-1:#10131c;--bg-2:#171b26;--bg-3:#1f2433;
      --border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.14);
      --text-1:#e7eaf3;--text-2:#9aa4b8;--text-3:#6b7385;
      --accent:#8b5cf6;--accent-soft:rgba(139,92,246,.16);
      --danger:#f87171;--success:#34d399;--warning:#fbbf24;--info:#60a5fa;
    }
    *{box-sizing:border-box;}
    body{
      margin:0;padding:0;color:var(--text-1);
      background:
        radial-gradient(1200px 600px at 15% -10%,rgba(139,92,246,.14),transparent 60%),
        radial-gradient(1000px 500px at 90% 0%,rgba(34,211,238,.10),transparent 55%),
        var(--bg-0);
      background-attachment:fixed;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .el-image__inner.el-image__inner { width: 100%; height: 90px; }
    .el-image { text-align: center; }
    .el-button+.el-button { margin: 0; }

    /* 顶栏 */
    .el-header{
      background:rgba(18,21,30,.72) !important;
      -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
      border-bottom:1px solid var(--border);
      box-shadow:0 8px 30px rgba(0,0,0,.35);
      color:var(--text-1);
    }
    .el-header a{text-decoration:none;}

    /* 卡片 */
    .el-card{
      background:var(--bg-2) !important;border:1px solid var(--border) !important;
      border-radius:14px !important;color:var(--text-1);
      box-shadow:0 6px 18px rgba(0,0,0,.3);
    }
    .el-card__body{color:var(--text-1);}

    /* 表格 */
    .el-table{background:var(--bg-2) !important;color:var(--text-1) !important;border-radius:14px;overflow:hidden;}
    .el-table::before,.el-table__fixed::before,.el-table__fixed-right::before{background-color:var(--border) !important;}
    .el-table th{background:var(--bg-3) !important;color:var(--text-2) !important;border-bottom:1px solid var(--border) !important;}
    .el-table td{background:var(--bg-2) !important;color:var(--text-1) !important;border-bottom:1px solid var(--border) !important;}
    .el-table tr:hover>td{background:#1d2230 !important;}
    .el-table__empty-block,.el-table__empty-text{background:var(--bg-2) !important;color:var(--text-3) !important;}

    /* 输入框 */
    .el-input__inner{background:var(--bg-3);border:1px solid var(--border-strong);color:var(--text-1);border-radius:8px;}
    .el-input__inner:hover{border-color:rgba(139,92,246,.5);}
    .el-input__inner:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
    .el-input__inner::placeholder{color:var(--text-3);}

    /* 按钮 */
    .el-button{border-radius:8px;font-weight:500;}
    .el-button--primary{background:var(--accent);border-color:var(--accent);}
    .el-button--primary:hover,.el-button--primary:focus{background:#7c3aed;border-color:#7c3aed;}
    .el-button--danger{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.4);color:var(--danger);}
    .el-button--danger:hover{background:var(--danger);border-color:var(--danger);color:#fff;}
    .el-button--info{background:var(--bg-3);border-color:var(--border-strong);color:var(--text-1);}
    .el-button--info:hover{background:#2a3142;border-color:var(--border-strong);}
    .el-button--default{background:var(--bg-3);border-color:var(--border-strong);color:var(--text-1);}
    .el-button--default:hover{color:var(--accent);border-color:rgba(139,92,246,.5);}

    /* tag */
    .el-tag{background:var(--bg-3);border-color:var(--border-strong);color:var(--text-2);}

    /* popover */
    .el-popover{background:var(--bg-2);border:1px solid var(--border-strong);color:var(--text-1);box-shadow:0 10px 30px rgba(0,0,0,.5);}
    .el-popover[x-placement^='top'] .popper__arrow::after{border-top-color:var(--bg-2) !important;}
    .el-popover p{color:var(--text-2);}

    /* message / messagebox */
    .el-message{background:var(--bg-2) !important;border:1px solid var(--border-strong) !important;box-shadow:0 10px 30px rgba(0,0,0,.5) !important;border-radius:12px !important;}
    .el-message--success{color:var(--success) !important;}
    .el-message--error{color:var(--danger) !important;}
    .el-message-box{background:var(--bg-2) !important;border:1px solid var(--border-strong) !important;color:var(--text-1) !important;border-radius:16px !important;}
    .el-message-box__title,.el-message-box__content,.el-message-box__message p{color:var(--text-1) !important;}

    /* 图片查看器 */
    .el-image-viewer__wrapper{background:rgba(0,0,0,.92) !important;}
    .el-image-viewer__close{color:var(--text-1) !important;}

    /* 加载更多按钮 */
    .el-main .el-button{margin-top:16px;}

    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-thumb{background:#2a3142;border-radius:10px;border:2px solid transparent;background-clip:content-box}
    ::-webkit-scrollbar-thumb:hover{background:#3a4258;background-clip:content-box}
  </style>
</head>

<body>
  <div id="app">
    <el-container>
      <el-header>
        <div style="
         margin: auto;
         line-height: 60px;
         font-size: xx-large;
         position: relative;
     ">Dashboard


          <span style="
     position: absolute;
     right: 0px;
      ">
            <a href="./admin-imgtc.html">
              <el-button size="mini" type="warning">网格视图</el-button>
            </a>
            <a href="./admin-waterfall.html">
              <el-button size="mini" type="primary">瀑布流</el-button>
            </a>
            <el-button v-if="showLogoutButton" size="mini" type="info" @click="handleLogout()">退出登录</el-button></span>
        </div>
      </el-header>
      <el-main><el-row :gutter="12">
          <el-col :span="24">
            <el-card shadow="always">
              记录总数量:
              {{ Number }}
            </el-card>
          </el-col>
          <!--<el-col :span="8">
              <el-card shadow="hover">
                <el-tooltip class="item" effect="dark" content="白名单数量" placement="top-start">
                   
                </el-tooltip>
                白名单数量：{{ WhiteList }}
              </el-card>
            </el-col>
            <el-col :span="8">
              <el-card shadow="hover">
                <el-tooltip class="item" effect="dark" content="黑名单数量" placement="top-start">
                
              </el-tooltip>
              黑名单数量：{{ BlackList }}
              </el-card>
            </el-col>-->
        </el-row>
        <template>
          <el-table :data="tableData.filter(data => !search || data.name.toLowerCase().includes(search.toLowerCase()))"
            style="width: 100%">
            <el-table-column label="name" prop="name">
            </el-table-column>
            <el-table-column label="preview" prop="preview" align="center">
              <template slot-scope="scope">
                <video v-if="scope.row.name.indexOf('.mp4')>0" style="width: 100%; height: 180px;" controls>
                  <source :src="'/file/'+scope.row.name" type="video/mp4">
                </video>
                <el-image v-else style="width: 100%; height: 100%;" :src="'/file/'+scope.row.name" :zoom-rate="1.2"
                  :preview-src-list="['/file/'+scope.row.name]" fit="cover" lazy />

              </template>
            </el-table-column>
            <el-table-column label="data" prop="data">
              <template slot-scope="scope">
                <el-popover trigger="hover" placement="top">
                  <p>{{ scope.row.metadata }}</p>
                  <div slot="reference" class="name-wrapper">
                    <el-tag size="medium">{{ scope.row.metadata }}</el-tag>
                  </div>
                </el-popover>
              </template>
            </el-table-column>
            <el-table-column align="right">
              <template slot="header" slot-scope="scope">
                <el-input v-model="search" @input="handleSearch" size="mini" placeholder="输入关键字搜索" />
              </template>
              <template slot-scope="scope">
                <el-button size="mini" type="primary" @click="handleCopy(scope.$index,scope.row.name)">复制地址</el-button>
                <el-button size="mini" type="primary" @click="handleWhite(scope.$index,scope.row.name)">白名单</el-button>
                <el-button size="mini" type="info" @click="handleBlock(scope.$index,scope.row.name)">黑名单</el-button>
                <el-button size="mini" type="danger" @click="handleDelete(scope.$index,scope.row.name)">删除</el-button>
              </template>
            </el-table-column>
            </el-table>
            <el-button v-if="nextCursor" style="margin-top:16px" @click="loadMore">加载更多</el-button>
          </template>
        </el-main>
    </el-container>
  </div>
</body>
<!-- import Vue before Element -->
<script src="./assets/vendor/vue.min.js"></script>
<!-- import JavaScript -->
<script src="./assets/vendor/element-ui/index.js"></script>
<script>
  var app = new Vue({
    el: '#app',
    data: {
      Number: 0,
      WhiteList: 0,
        BlackList: 0,
        showLogoutButton: false,
        tableData: [],
        nextCursor: null,
      dialogFormVisible: false,
      formLabelWidth: '120px',
      form: {
        name: '',
        id: ''
      },
      search: '',
      password: '123456',
      searchTimer: null
    },
    methods: {
      handleBlock(index, key) {
        console.log(key);
        if (confirm("确认加入黑名单吗?")) {
          console.log("Yes")
          var requestOptions = {
            method: 'GET',
            redirect: 'follow',
            //include authorization credientials
            credentials: 'include'
          };

          fetch("./api/manage/block/" + key, requestOptions)
            .then(response => response.text())
            .then(result => {
              console.log(result);
              this.tableData[index].metadata = result;
            })
            .catch(error => { alert("An error occurred while synchronizing data with the server, please check the network connection"); console.log('error', error) });

        } else {
          console.log("No")
        }
      },
      handleDelete(index, key) {
        console.log(key);
        if (confirm("确认删除该条记录吗?")) {
          console.log("Yes")
          var requestOptions = {
            method: 'GET',
            redirect: 'follow',
            //include authorization credientials
            credentials: 'include'
          };

          fetch("./api/manage/delete/" + key, requestOptions)
            .then(response => response.text())
            .then(result => { console.log(result); this.tableData.remove(index); })
            .catch(error => { alert("An error occurred while synchronizing data with the server, please check the network connection"); console.log('error', error) });

        } else {
          console.log("No")
        }
      },
      handleWhite(index, key) {
        console.log(key);
        if (confirm("确认加入白名单吗?")) {
          console.log("Yes")
          var requestOptions = {
            method: 'GET',
            redirect: 'follow',
            //include authorization credientials
            credentials: 'include'
          };
          fetch("./api/manage/white/" + key, requestOptions)
            .then(response => response.text())
            .then(result => { console.log(result); this.tableData[index].metadata = result; })
            .catch(error => { alert("An error occurred while synchronizing data with the server, please check the network connection"); console.log('error', error) });

        } else {
          console.log("No")
        }

      },
      handleLogout() {
        window.location.href = "./api/manage/logout";
      },
      handleCopy(index, key) {
        const text = `${document.location.origin}/file/${key}`;
        if (navigator.clipboard) {
          // clipboard api 复制
          navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement('textarea');
          document.body.appendChild(textarea);
          // 隐藏此输入框
          textarea.style.position = 'fixed';
          textarea.style.clip = 'rect(0 0 0 0)';
          textarea.style.top = '10px';
          // 赋值
          textarea.value = text;
          // 选中
          textarea.select();
          // 复制
          document.execCommand('copy', true);
          // 移除输入框
          document.body.removeChild(textarea);
        }
        this.$message({
          message: '复制文件链接成功~',
          type: 'success'
        });
      },
      handleSearch() {
        clearTimeout(this.searchTimer);
        this.searchTimer = setTimeout(() => {
          this.tableData = [];
          this.nextCursor = null;
          const opts = { method: 'GET', redirect: 'follow', credentials: 'include' };
          const base = this.search
            ? `./api/manage/list?limit=100&prefix=${encodeURIComponent(this.search)}`
            : `./api/manage/list?limit=100`;
          fetch(base, opts)
            .then(r => r.json())
            .then(result => {
              this.tableData = result.keys || [];
              this.nextCursor = result.list_complete ? null : result.cursor;
              this.Number = this.tableData.length;
            })
            .catch(() => alert("搜索失败，请检查网络"));
        }, 300);
      },
      loadMore() {
        const opts = { method: 'GET', redirect: 'follow', credentials: 'include' };
        const base = this.search
          ? `./api/manage/list?limit=100&prefix=${encodeURIComponent(this.search)}`
          : `./api/manage/list?limit=100`;
        const url = this.nextCursor
          ? `${base}&cursor=${encodeURIComponent(this.nextCursor)}`
          : base;

        fetch(url, opts)
          .then(r => r.json())
          .then(result => {
            this.tableData = this.tableData.concat(result.keys || []);
            this.nextCursor = result.list_complete ? null : result.cursor;
            this.Number = this.tableData.length;
          })
          .catch(() => alert("同步失败，请检查网络"));
      },
    },

    mounted() {
      //check if the user is logged in
      //read the basic auth credientials from the browser
      var requestOptions = {
        method: 'GET',
        redirect: 'follow',
        //include authorization credientials
        credentials: 'include'
      };
      fetch("./api/manage/check", requestOptions)
        .then(response => response.text())
        .then(result => {
          console.log(result);
          if (result == "true") {
            this.showLogoutButton = true;
          } else if (result == "Not using basic auth.") {

          }
          else {
            window.location.href = "./api/manage/login";
          }
        })
        .catch(error => { alert("An error occurred while synchronizing data with the server, please check the network connection"); console.log('error', error) });



      Array.prototype.remove = function (from, to) {
        var rest = this.slice((to || from) + 1 || this.length);
        this.length = from < 0 ? this.length + from : from;
        return this.push.apply(this, rest);
      };
      var requestOptions = {
        method: 'GET',
        redirect: 'follow',
        //include authorization credientials
        credentials: 'include'

      };


        fetch("./api/manage/list?limit=100", requestOptions)
        //判断是否需要登录
        .then(response => {
          if (response.status == 401) {
            alert("请先登录");
            window.location.href = "./api/manage/login";
          }
          else {
            return response;
          }
        })
        .then(response => response.json())
        .then(result => {
          this.tableData = result.keys || [];
          this.nextCursor = result.list_complete ? null : result.cursor;
          console.log(result);
          this.Number = this.tableData.length;
        })
        .catch(error => { alert("An error occurred while synchronizing data with the server, please check the network connection"); console.log('error', error) });

    }
  })

</script>
</html>
