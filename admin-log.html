<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问日志 · IMG床图</title>
<link rel="icon" href="./favicon.ico">
<style>
  :root{
    --bg:#0f1117; --panel:rgba(255,255,255,.04); --line:rgba(255,255,255,.08);
    --text:#e8eaf0; --muted:#9aa3b2; --accent:#8b5cf6; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);
    background:rgba(15,17,23,.82);border-bottom:1px solid var(--line)}
  .bar{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{font-weight:600;letter-spacing:.3px}
  .brand span{color:var(--accent)}
  .spacer{flex:1}
  .stat{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
  .stat b{color:var(--text);font-weight:600}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.err{background:var(--err)}
  button,select,input{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:7px 11px;outline:none}
  button{cursor:pointer;transition:.15s}
  button:hover{border-color:rgba(139,92,246,.55);background:rgba(139,92,246,.12)}
  button.danger:hover{border-color:rgba(248,113,113,.6);background:rgba(248,113,113,.12)}
  input{min-width:200px}
  main{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.4px;background:rgba(255,255,255,.02)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:rgba(255,255,255,.025)}
  .tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid}
  .tag.up{color:var(--ok);border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.1)}
  .tag.rej{color:var(--warn);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.1)}
  .tag.blk{color:var(--err);border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.1)}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
  .muted{color:var(--muted)}
  .ua{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  a{color:#a78bfa;text-decoration:none} a:hover{text-decoration:underline}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  .hint{padding:10px 12px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
  @media (max-width:760px){ .hide-sm{display:none} input{min-width:120px} }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">IMG床图 · <span>访问日志</span></div>
    <div class="stat"><i class="dot ok"></i>上传 <b id="s-upload">0</b></div>
    <div class="stat"><i class="dot warn"></i>拒绝 <b id="s-rejected">0</b></div>
    <div class="stat"><i class="dot err"></i>拦截 <b id="s-blocked">0</b></div>
    <div class="spacer"></div>
    <select id="type">
      <option value="all">全部</option>
      <option value="upload">仅成功上传</option>
      <option value="rejected">仅被拒绝</option>
      <option value="blocked">仅路径拦截</option>
    </select>
    <input id="q" placeholder="搜索 IP / UA / 文件名">
    <button id="refresh">刷新</button>
    <button id="clear" class="danger">清空</button>
    <a href="./admin-imgtc.html"><button type="button">返回后台</button></a>
  </div>
</header>

<main>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th style="width:150px">时间</th>
          <th style="width:110px">动作</th>
          <th style="width:190px">来源 IP</th>
          <th>环境（UA / 地区）</th>
          <th style="width:210px">文件</th>
          <th style="width:80px" class="hide-sm">耗时</th>
          <th style="width:170px">结果</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">暂无日志</div>
    <div class="hint" id="hint"></div>
  </div>
</main>

<script>
(function(){
  var rowsEl = document.getElementById('rows');
  var emptyEl = document.getElementById('empty');
  var hintEl = document.getElementById('hint');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function fmtTime(ts){
    if(!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' '
      + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  function fmtSize(n){
    if(!n) return '';
    if(n < 1024) return n + ' B';
    if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
    return (n/1024/1024).toFixed(2) + ' MB';
  }
  // 把 UA 压成"浏览器 · 系统 · 设备"这种一眼能看懂的描述
  function describeUA(ua){
    if(!ua) return '未知设备';
    var browser = /Edg\//.test(ua) ? 'Edge'
      : /OPR\/|Opera/.test(ua) ? 'Opera'
      : /Firefox\//.test(ua) ? 'Firefox'
      : /MicroMessenger/.test(ua) ? '微信内置'
      : /Chrome\//.test(ua) ? 'Chrome'
      : /Safari\//.test(ua) ? 'Safari'
      : /curl\//.test(ua) ? 'curl'
      : /python-requests|Python\//.test(ua) ? 'Python 脚本'
      : /okhttp|Go-http-client|axios|node-fetch/.test(ua) ? 'HTTP 客户端'
      : '其他';
    var os = /Windows NT 10/.test(ua) ? 'Windows 10/11'
      : /Windows NT 6/.test(ua) ? 'Windows 7/8'
      : /iPhone|iPad|iPod/.test(ua) ? 'iOS'
      : /Android/.test(ua) ? 'Android'
      : /Mac OS X/.test(ua) ? 'macOS'
      : /Linux/.test(ua) ? 'Linux'
      : '未知系统';
    var mobile = /Mobile|Android|iPhone|iPad/.test(ua) ? '移动端' : '桌面端';
    return browser + ' · ' + os + ' · ' + mobile;
  }
  function place(e){
    var parts = [];
    if(e.country) parts.push(e.country);
    if(e.city) parts.push(e.city);
    if(e.asn) parts.push('AS' + e.asn);
    if(e.colo) parts.push(e.colo);
    return parts.join(' · ');
  }
  function tagClass(action){
    if(action === 'upload') return 'up';
    if(action === 'upload_rejected') return 'rej';
    return 'blk';
  }
  function tagText(action){
    if(action === 'upload') return '上传成功';
    if(action === 'upload_rejected') return '上传被拒';
    if(action === 'file_blocked') return '路径拦截';
    return action || '未知';
  }

  function render(data){
    document.getElementById('s-upload').textContent = data.stats.upload;
    document.getElementById('s-rejected').textContent = data.stats.rejected;
    document.getElementById('s-blocked').textContent = data.stats.blocked;

    if(!data.enabled){
      emptyEl.style.display = 'block';
      emptyEl.textContent = '日志未启用：请绑定 KV（变量名 img_url 或 LOG_KV）';
      rowsEl.innerHTML = '';
      return;
    }
    if(!data.entries.length){
      emptyEl.style.display = 'block';
      emptyEl.textContent = '暂无日志';
      rowsEl.innerHTML = '';
      hintEl.textContent = '';
      return;
    }
    emptyEl.style.display = 'none';

    rowsEl.innerHTML = data.entries.map(function(e){
      var fileCell = e.fileKey
        ? '<a href="/file/' + encodeURIComponent(e.fileKey) + '" target="_blank" rel="noopener">' + esc(e.fileName || e.fileKey) + '</a>'
          + '<div class="muted" style="font-size:12px">' + esc(fmtSize(e.fileSize)) + (e.mime ? ' · ' + esc(e.mime) : '') + '</div>'
        : '<span class="muted">—</span>';
      var resultCell = (e.ok ? '<span style="color:var(--ok)">成功</span>' : '<span style="color:var(--err)">失败</span>')
        + (e.code ? ' <span class="mono muted">' + esc(e.code) + '</span>' : '')
        + (e.reason ? '<div class="muted" style="font-size:12px">' + esc(e.reason) + '</div>' : '');
      return '<tr>'
        + '<td class="mono">' + esc(fmtTime(e.ts)) + '</td>'
        + '<td><span class="tag ' + tagClass(e.action) + '">' + esc(tagText(e.action)) + '</span></td>'
        + '<td class="mono">' + esc(e.ip || '—')
          + (place(e) ? '<div class="muted" style="font-size:12px">' + esc(place(e)) + '</div>' : '') + '</td>'
        + '<td><div title="' + esc(e.ua || '') + '">' + esc(describeUA(e.ua)) + '</div>'
          + '<div class="muted ua" title="' + esc(e.ua || '') + '">' + esc(e.ua || '') + '</div>'
          + (e.referer ? '<div class="muted ua" style="font-size:12px">来源: ' + esc(e.referer) + '</div>' : '') + '</td>'
        + '<td>' + fileCell + '</td>'
        + '<td class="mono muted hide-sm">' + (e.durationMs != null ? esc(e.durationMs) + ' ms' : '—') + '</td>'
        + '<td>' + resultCell + '</td>'
        + '</tr>';
    }).join('');

    hintEl.textContent = '共 ' + data.total + ' 条' + (data.complete ? '' : '（还有更早的记录，可用 cursor 翻页）')
      + ' · 每页最多 500 条 · 日志按 LOG_RETENTION_DAYS 自动过期';
  }

  function load(){
    var params = new URLSearchParams();
    params.set('limit', '200');
    var type = document.getElementById('type').value;
    if(type !== 'all') params.set('type', type);
    var q = document.getElementById('q').value.trim();
    if(q) params.set('q', q);

    fetch('./api/manage/logs?' + params.toString(), { credentials: 'include' })
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(function(err){
        emptyEl.style.display = 'block';
        emptyEl.textContent = '加载失败：' + err.message;
      });
  }

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('type').addEventListener('change', load);
  var timer;
  document.getElementById('q').addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(load, 350);
  });
  document.getElementById('clear').addEventListener('click', function(){
    if(!confirm('确定清空所有日志？此操作不可恢复。')) return;
    fetch('./api/manage/logs?confirm=yes&limit=200', { method: 'DELETE', credentials: 'include' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        alert(d.success ? ('已删除 ' + d.deleted + ' 条' + (d.complete ? '' : '（还有剩余，可再次清空）')) : (d.error || '清空失败'));
        load();
      })
      .catch(function(){ alert('清空失败，请检查网络'); });
  });

  load();
})();
</script>
</body>
</html>
